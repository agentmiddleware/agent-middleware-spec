[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "b2a-sdk"
version = "0.5.0"
description = "Offline verifier for Agent Middleware signed receipts (Ed25519, no network)."
readme = { text = "Offline verifier for Agent Middleware signed receipts.", content-type = "text/plain" }
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
verify = ["cryptography>=50.0.0"]
dev = ["pytest>=9.0.3", "cryptography>=50.0.0"]

[project.scripts]
b2a-verify-receipt = "b2a_sdk.verify_cli:main"

[project.urls]
Homepage = "https://github.com/agentmiddleware/agent-middleware-spec"
Repository = "https://github.com/agentmiddleware/agent-middleware-spec"

[tool.hatch.build.targets.wheel]
packages = ["src/b2a_sdk"]
